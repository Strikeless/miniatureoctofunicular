[package]
name = "crawler"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
headless_chrome = "1.0"
sqlx = { version = "0.9", features = [ "runtime-tokio", "sqlite", "migrate", "derive" ] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.21"
json5 = "1.3"

clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2.5", features = ["serde"] }
regex = "1.12"
blake3 = "1"
chrono = "0.4"
rand = "0.10"
reqwest = "0.13"
base64 = "0.22"
